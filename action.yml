name: DecisionTrace Shadow Scan
description: Run a local-only DecisionTrace scan, upload reports, and gate only when the target explicitly enables deterministic gates.
inputs:
  repository:
    description: Repository path relative to the GitHub workspace.
    required: false
    default: .
  base:
    description: Optional base Git ref; must be paired with head.
    required: false
  head:
    description: Optional head Git ref; must be paired with base.
    required: false
  output:
    description: Repository-relative report directory.
    required: false
    default: .decisiontrace/reports/github-action
runs:
  using: composite
  steps:
    - name: Install DecisionTrace
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Build DecisionTrace
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm run build
    - name: Scan in shadow mode
      id: scan
      shell: bash
      env:
        DECISIONTRACE_REPOSITORY: ${{ inputs.repository }}
        DECISIONTRACE_BASE: ${{ inputs.base }}
        DECISIONTRACE_HEAD: ${{ inputs.head }}
        DECISIONTRACE_OUTPUT: ${{ inputs.output }}
      run: |
        target_repository="$GITHUB_WORKSPACE/$DECISIONTRACE_REPOSITORY"
        args=(scan --repo "$target_repository" --semantic off --output "$DECISIONTRACE_OUTPUT")
        if [[ -n "$DECISIONTRACE_BASE" || -n "$DECISIONTRACE_HEAD" ]]; then
          args+=(--base "$DECISIONTRACE_BASE" --head "$DECISIONTRACE_HEAD")
        fi
        set +e
        node "$GITHUB_ACTION_PATH/dist/cli/main.js" "${args[@]}"
        status=$?
        set -e
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
    - name: Upload DecisionTrace reports
      uses: actions/upload-artifact@v4
      with:
        name: decisiontrace-report
        path: ${{ github.workspace }}/${{ inputs.repository }}/${{ inputs.output }}
        if-no-files-found: error
    - name: Preserve trusted scan status
      shell: bash
      env:
        DECISIONTRACE_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
      run: exit "$DECISIONTRACE_EXIT_CODE"
